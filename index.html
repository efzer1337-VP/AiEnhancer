<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Prompt Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #02040a;
      }
      
      /* Custom Scrollbar - Higher Contrast */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f111a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
        border: 2px solid #0f111a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Utilities */
      .glass-panel {
        background: rgba(19, 21, 28, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .custom-scrollbar::-webkit-scrollbar {
         width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
         background-color: rgba(255, 255, 255, 0.1);
         border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
         background-color: rgba(255, 255, 255, 0.2);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-[#02040a] text-slate-200 antialiased selection:bg-indigo-500/30 selection:text-white">
    <div id="root"></div>

  </body>
</html>
